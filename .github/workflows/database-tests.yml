name: Database Tests

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.98.2

      - name: Validate migration inventory
        run: |
          test -f supabase/config.toml
          test -d supabase/migrations
          test -f supabase/tests/database/enquiries_pipeline_test.sql
          echo "Migration files:"
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | sort

      - name: Start local Supabase
        run: supabase start

      - name: Run database tests
        run: supabase test db
