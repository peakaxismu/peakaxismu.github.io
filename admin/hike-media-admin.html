<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hike Media Admin</title><style>body{font-family:Arial,sans-serif;max-width:1000px;margin:40px auto;padding:0 20px}select,input,button{padding:10px;margin:6px 0}section{border:1px solid #ddd;padding:20px;margin:20px 0;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.grid img{width:100%;height:140px;object-fit:cover;border-radius:6px}</style></head><body><h1>Hike image manager</h1><p>Upload a main image and additional gallery photos for each hike.</p><section><label>Hike<br><select id="hike"></select></label><br><label>Main image<br><input id="main" type="file" accept="image/*"></label><br><label>Additional photos<br><input id="gallery" type="file" accept="image/*" multiple></label><br><button id="save">Upload photos</button><p id="status"></p></section><section><h2>Current photos</h2><div id="photos" class="grid"></div></section><script type="module">const SUPABASE_URL='https://ynieinxofhmlssuygflq.supabase.co';const SUPABASE_KEY='YOUR_SUPABASE_PUBLISHABLE_KEY';const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);const hike=document.querySelector('#hike'),main=document.querySelector('#main'),gallery=document.querySelector('#gallery'),status=document.querySelector('#status'),photos=document.querySelector('#photos');let hikes=[];async function load(){const {data,error}=await supabase.from('hikes').select('id,name').order('name');if(error){status.textContent=error.message;return}hikes=data||[];hike.innerHTML=hikes.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');await refresh()}async function refresh(){const {data,error}=await supabase.from('hike_media').select('*').eq('hike_id',hike.value).order('sort_order');if(error){status.textContent=error.message;return}photos.innerHTML=(data||[]).map(x=>`<div><img src="${x.image_url}"><small>${x.is_main?'Main image':'Gallery image'}</small></div>`).join('')}async function upload(file,isMain,order){const path=`hikes/${hike.value}/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error:e}=await supabase.storage.from('hike-media').upload(path,file,{upsert:false,contentType:file.type});if(e)throw e;const {data:u}=supabase.storage.from('hike-media').getPublicUrl(path);const {error:d}=await supabase.from('hike_media').insert({hike_id:hike.value,storage_path:path,image_url:u.publicUrl,is_main:isMain,sort_order:order});if(d)throw d}document.querySelector('#save').onclick=async()=>{status.textContent='Uploading…';try{if(main.files[0]){await supabase.from('hike_media').update({is_main:false}).eq('hike_id',hike.value);await upload(main.files[0],true,0)}let n=1;for(const f of gallery.files)await upload(f,false,n++);status.textContent='Photos uploaded.';main.value='';gallery.value='';await refresh()}catch(e){status.textContent=e.message||String(e)}};hike.onchange=refresh;load();</script></body></html>
